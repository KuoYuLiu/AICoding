name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicoding
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aicoding
      # Test-only values: e2e signs in by minting its own session cookie, Google is never contacted.
      AUTH_SECRET: e2e-only-secret-not-used-anywhere-else
      AUTH_GOOGLE_ID: e2e
      AUTH_GOOGLE_SECRET: e2e
      AUTH_TRUST_HOST: "true"
      # Student code runs in local Docker containers on the CI machine (test-only opt-in for `next start`).
      CODE_RUNNER: docker
      CODE_RUNNER_ALLOW_DOCKER_IN_PRODUCTION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: docker pull python:3.12-slim
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
